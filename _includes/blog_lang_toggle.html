{%- comment -%} Usage: include blog_lang_toggle.html lang=en {%- endcomment -%}
<nav class="blog-lang-toggle" aria-label="Language">
  <a href="{{ '/blog/' | relative_url }}" lang="en" hreflang="en"{% if include.lang == 'en' %} aria-current="page" class="active"{% endif %}>English</a>
  <a href="{{ '/blog/bn/' | relative_url }}" lang="bn" hreflang="bn"{% if include.lang == 'bn' %} aria-current="page" class="active"{% endif %}>বাংলা</a>
</nav>
<style>
  .blog-lang-toggle {
    display: inline-flex;
    border: 1px solid var(--global-divider-color);
    border-radius: 999px;
    overflow: hidden;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .blog-lang-toggle a {
    display: block;
    padding: 0.35rem 0.9rem;
    line-height: 1.5;
    font-family: 'Roboto', sans-serif;
    color: var(--global-text-color);
    text-decoration: none;
    border-bottom: 0;
  }
  .blog-lang-toggle a:hover { color: var(--global-theme-color); }
  .blog-lang-toggle a.active {
    background-color: var(--global-theme-color);
    color: var(--global-bg-color);
  }
  .blog-lang-toggle a.active:hover { color: var(--global-bg-color); }
  .blog-lang-toggle a[lang="bn"] { font-family: 'Noto Serif Bengali', serif; }
</style>
